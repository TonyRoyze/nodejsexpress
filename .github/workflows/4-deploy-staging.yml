name: 4 - Deploy to Staging (Vercel)

on:
  push:
    branches:
      - staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN_STAGING }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN_STAGING }}

      - name: Deploy to Vercel (staging)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_STAGING }}

      - name: Smoke test staging
        run: |
          sleep 10
          curl --fail ${{ secrets.STAGING_URL }}/health
